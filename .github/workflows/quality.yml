name: Validar MyOwnDex

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: myowndex-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 · Node 24
      - name: Preparar o Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 · Node 24
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependências verificadas
        run: npm ci
      - name: Verificar segurança das dependências de produção
        run: npm audit --omit=dev --audit-level=moderate
      - name: Confirmar fontes externas atuais
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run freshness
      - name: Testar regras e integrações
        run: npm test
      - name: Revisar o código
        run: npm run lint
      - name: Verificar os tipos
        run: npx tsc --noEmit --incremental false
      - name: Compilar o artefato completo
        run: npm run build
