name: Validar MyOwnDex

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: myowndex-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sources-current:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 · Node 24
      - name: Preparar o Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 · Node 24
        with:
          node-version: 24
      - name: Confirmar fontes externas atuais
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run freshness

  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 · Node 24
      - name: Preparar o Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 · Node 24
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependências verificadas
        run: npm ci
      - name: Verificar segurança das dependências de produção
        run: npm audit --omit=dev --audit-level=moderate
      - name: Testar regras e integrações
        run: npm test
      - name: Revisar o código
        run: npm run lint
      - name: Verificar os tipos
        run: npx tsc --noEmit --incremental false
      - name: Compilar o artefato completo
        run: npm run build


  browser-quality:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Preparar o Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependências verificadas
        run: npm ci
      - name: Instalar navegador de QA sem alterar o lockfile
        run: |
          # The Azure HTTP mirror stalled font downloads in previous runs.
          # Keep the same signed Ubuntu packages through the official HTTPS mirror.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          npm install --no-save --package-lock=false playwright@1.56.1 axe-core@4.11.1
          npx playwright install --with-deps chromium
      - name: Compilar para QA real
        run: npm run build
      - name: Subir MyOwnDex local
        id: browser-server
        run: |
          npm run start > /tmp/myowndex-browser.log 2>&1 &
          echo $! > /tmp/myowndex-browser.pid
          for i in {1..60}; do curl -fsS http://127.0.0.1:3000 >/dev/null && exit 0; sleep 1; done
          cat /tmp/myowndex-browser.log
          exit 1
      - name: Testar declarações e iniciativa reais em aventura e treino
        if: ${{ !cancelled() && steps.browser-server.outcome == 'success' }}
        env:
          MYOWNDEX_PLAYWRIGHT_MODULE: playwright
          MYOWNDEX_SMOKE_URL: http://127.0.0.1:3000
        run: |
          browser_test_status=0
          node tests/browser-round-declarations.mjs || browser_test_status=1
          node tests/browser-turn-order.mjs || browser_test_status=1
          exit "$browser_test_status"
      - name: Conferir topo, painéis, foco e navegação do aplicativo
        if: ${{ !cancelled() && steps.browser-server.outcome == 'success' }}
        env:
          MYOWNDEX_PLAYWRIGHT_MODULE: playwright
          MYOWNDEX_SMOKE_URL: http://127.0.0.1:3000
        run: node tests/browser-app-shell.mjs
      - name: Conferir moldura, teclado e foco com Box cheia
        if: ${{ !cancelled() && steps.browser-server.outcome == 'success' }}
        env:
          MYOWNDEX_PLAYWRIGHT_MODULE: playwright
          MYOWNDEX_SMOKE_URL: http://127.0.0.1:3000
        run: node tests/browser-viewport-stability.mjs
      - name: Conferir sugestões, créditos e continuidade dos diálogos
        if: ${{ !cancelled() && steps.browser-server.outcome == 'success' }}
        env:
          MYOWNDEX_PLAYWRIGHT_MODULE: playwright
          MYOWNDEX_SMOKE_URL: http://127.0.0.1:3000
        run: node tests/browser-interface-continuity.mjs
      - name: Conferir posição da Aventura e expansão dos papéis
        if: ${{ !cancelled() && steps.browser-server.outcome == 'success' }}
        env:
          MYOWNDEX_PLAYWRIGHT_MODULE: playwright
          MYOWNDEX_SMOKE_URL: http://127.0.0.1:3000
          MYOWNDEX_REVIEW_IMAGES: ${{ github.event_name == 'pull_request' && '1' || '0' }}
        run: node tests/browser-adventure-layout.mjs
      - name: Conferir cores agrupadas, arte visível e entrada de jogo
        if: ${{ !cancelled() && steps.browser-server.outcome == 'success' }}
        env:
          MYOWNDEX_PLAYWRIGHT_MODULE: playwright
          MYOWNDEX_SMOKE_URL: http://127.0.0.1:3000
        run: node tests/browser-visual-direction.mjs
      - name: Conferir a recompensa de XP, treinamento e amizade na ficha
        if: ${{ !cancelled() && steps.browser-server.outcome == 'success' }}
        env:
          MYOWNDEX_PLAYWRIGHT_MODULE: playwright
          MYOWNDEX_SMOKE_URL: http://127.0.0.1:3000
        run: node tests/browser-growth.mjs
      - name: Conferir movimentos, PP históricos, descrições e teclado mobile
        if: ${{ !cancelled() && steps.browser-server.outcome == 'success' }}
        env:
          MYOWNDEX_PLAYWRIGHT_MODULE: playwright
          MYOWNDEX_SMOKE_URL: http://127.0.0.1:3000
        run: node tests/browser-moves-mobile.mjs
      - name: Testar matriz real de telas, sprites e Dados
        if: ${{ !cancelled() && steps.browser-server.outcome == 'success' }}
        env:
          MYOWNDEX_PLAYWRIGHT_MODULE: playwright
          MYOWNDEX_SMOKE_URL: http://127.0.0.1:3000
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=15s 420s node tests/browser-responsive.mjs | tee /tmp/myowndex-responsive.log
          echo "Matriz responsiva concluída."
      - name: Conferir coleção completa e navegação com CPU reduzida
        if: ${{ !cancelled() && steps.browser-server.outcome == 'success' }}
        env:
          MYOWNDEX_PLAYWRIGHT_MODULE: playwright
          MYOWNDEX_SMOKE_URL: http://127.0.0.1:3000
        run: |
          browser_test_status=0
          node tests/browser-performance.mjs || browser_test_status=1
          node tests/browser-guide-performance.mjs || browser_test_status=1
          node tests/browser-api-cache.mjs || browser_test_status=1
          exit "$browser_test_status"
      - name: Gerar, editar e limpar encontros no mobile com CPU reduzida
        if: ${{ !cancelled() && steps.browser-server.outcome == 'success' }}
        env:
          MYOWNDEX_PLAYWRIGHT_MODULE: playwright
          MYOWNDEX_SMOKE_URL: http://127.0.0.1:3000
        run: |
          browser_test_status=0
          node tests/browser-generator-mobile.mjs || browser_test_status=1
          node tests/browser-personal-deletions.mjs || browser_test_status=1
          exit "$browser_test_status"
      - name: Testar mundo 2D, acessibilidade e desempenho
        if: ${{ !cancelled() && steps.browser-server.outcome == 'success' }}
        env:
          MYOWNDEX_PLAYWRIGHT_MODULE: playwright
          MYOWNDEX_SMOKE_URL: http://127.0.0.1:3000
        run: node tests/browser-2d-world.mjs
      - name: Confirmar clima animado e instalação discreta no navegador
        if: ${{ !cancelled() && steps.browser-server.outcome == 'success' }}
        env:
          MYOWNDEX_PLAYWRIGHT_MODULE: playwright
          MYOWNDEX_SMOKE_URL: http://127.0.0.1:3000
        run: node tests/browser-weather.mjs
      - name: Confirmar avisos compactos e cabeçalho das Boxes
        if: ${{ !cancelled() && steps.browser-server.outcome == 'success' }}
        env:
          MYOWNDEX_PLAYWRIGHT_MODULE: playwright
          MYOWNDEX_SMOKE_URL: http://127.0.0.1:3000
        run: node tests/browser-compact-feedback.mjs
      - name: Conferir Shiny e HP na ficha em todos os tamanhos
        if: ${{ !cancelled() && steps.browser-server.outcome == 'success' }}
        env:
          MYOWNDEX_PLAYWRIGHT_MODULE: playwright
          MYOWNDEX_SMOKE_URL: http://127.0.0.1:3000
        run: node tests/browser-pokemon-vitals.mjs
      - name: Navegar pela linha evolutiva sem mover a Pokédex
        if: ${{ !cancelled() && steps.browser-server.outcome == 'success' }}
        env:
          MYOWNDEX_PLAYWRIGHT_MODULE: playwright
          MYOWNDEX_SMOKE_URL: http://127.0.0.1:3000
        run: node tests/browser-evolution-navigation.mjs
      - name: Testar transformações, lados e retirada em todas as fases
        if: ${{ !cancelled() && steps.browser-server.outcome == 'success' }}
        env:
          MYOWNDEX_PLAYWRIGHT_MODULE: playwright
          MYOWNDEX_SMOKE_URL: http://127.0.0.1:3000
        run: node tests/browser-gimmicks-phases.mjs
      - name: Verificar atualização automática e cabeçalhos do PWA
        if: ${{ !cancelled() && steps.browser-server.outcome == 'success' }}
        env:
          MYOWNDEX_PLAYWRIGHT_MODULE: playwright
          MYOWNDEX_SMOKE_URL: http://127.0.0.1:3000
        run: node tests/browser-release-update.mjs
      - name: Conferir a versão publicada sem alterar contas ou aventuras
        if: ${{ !cancelled() && steps.browser-server.outcome == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          MYOWNDEX_PLAYWRIGHT_MODULE: playwright
          MYOWNDEX_SMOKE_URL: https://myowndex.vercel.app
        run: node tests/browser-production.mjs
      - name: Exibir log em caso de falha
        if: failure()
        run: cat /tmp/myowndex-browser.log || true
      - name: Encerrar servidor de QA
        if: always()
        run: |
          if [ -f /tmp/myowndex-browser.pid ]; then
            kill "$(cat /tmp/myowndex-browser.pid)" 2>/dev/null || true
          fi
