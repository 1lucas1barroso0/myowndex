name: Validar MyOwnDex

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: myowndex-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 · Node 24
      - name: Preparar o Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 · Node 24
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependências verificadas
        run: npm ci
      - name: Verificar segurança das dependências de produção
        run: npm audit --omit=dev --audit-level=moderate
      - name: Confirmar fontes externas atuais
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run freshness
      - name: Testar regras e integrações
        run: npm test
      - name: Revisar o código
        run: npm run lint
      - name: Verificar os tipos
        run: npx tsc --noEmit --incremental false
      - name: Compilar o artefato completo
        run: npm run build


  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 · Node 24
      - name: Preparar o Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 · Node 24
        with:
          node-version: 24
          cache: npm
      - name: Instalar aplicação
        run: npm ci
      - name: Preparar navegador sem alterar o lockfile
        run: npm install --no-save --package-lock=false playwright-core@1.56.1
      - name: Compilar para o teste de navegador
        run: npm run build
      - name: Iniciar servidor local
        run: |
          npm run start > /tmp/myowndex-browser.log 2>&1 &
          echo $! > /tmp/myowndex-browser.pid
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/myowndex-browser.log
          exit 1
      - name: Auditar telas, sprites e rolagens em navegador real
        env:
          MYOWNDEX_PLAYWRIGHT_MODULE: playwright-core
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          MYOWNDEX_BROWSER_EXECUTABLE="$BROWSER" node tests/browser-responsive.mjs
      - name: Encerrar servidor
        if: always()
        run: |
          if [ -f /tmp/myowndex-browser.pid ]; then
            kill "$(cat /tmp/myowndex-browser.pid)" 2>/dev/null || true
          fi
