name: Reproduzir cenários corrigidos (temporário)
on:
  push:
    branches:
      - fix/scene-collision-and-xp-audit-20261010
permissions:
  contents: write
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow==11.3.0'
      - name: Reproduzir e conferir os nove SVG locais
        run: |
          python scripts/reproduzir-cenarios-2d.py
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path("public/scenes/source/provenance.json").read_text())
          assert len(m["scenes"]) == 9
          assert sum(s["bytes"] for s in m["scenes"]) < 60000
          assert all(s["bytes"] < 12000 for s in m["scenes"])
          PY
      - name: Preservar as artes geradas na mesma branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/scenes/*.svg public/scenes/source/provenance.json
          if ! git diff --cached --quiet; then
            git commit -m "art: rebuild nine verified scenes without clipped landmarks"
            git push origin HEAD:fix/scene-collision-and-xp-audit-20261010
          fi
